; xCAT management node inventory.
;
; Kept separate from inventory.yml because that file is INI-format but named
; .yml, which breaks YAML-aware tooling. Merge both at run time:
;
;   ansible-playbook -i inventory.yml -i inventory_xcat.ini playbook/xcat_pb.yml
;
; The name xcat2.edsonmanners.com is not yet in BIND; ansible_host is required
; until roles/dns_server publishes it.

[xcat_mn]
xcat2.edsonmanners.com ansible_host=192.168.68.7