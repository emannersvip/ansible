---
- hosts: all
  become: yes
  tasks:
    - name: Install ansible
      ansible.builtin.apt:
        name: ansible
        update_cache: yes
    - name: Install git
      ansible.builtin.apt:
        name: git
        update_cache: yes
    - name: Install htop
      ansible.builtin.apt:
        name: htop
        update_cache: yes
    - name: Install ipmitool
      ansible.builtin.apt:
        name: ipmitool
        update_cache: yes
    - name: Install mlocate
      ansible.builtin.apt:
        name: mlocate
        update_cache: yes
    - name: Install screen
      ansible.builtin.apt:
        name: screen
        update_cache: yes
    - name: Install vim
      ansible.builtin.apt:
        name: vim
        update_cache: yes
