---
# tasks file for roles/neovim

- name: Make sure Ubuntu's default neovim package is not installed
  ansible.builtin.apt:
    name:
      - neovim
      - neovim-runtime
    state: absent
  when: ansible_facts["os_family"] == "Debian"
  tags:
    - neovim

- name: Download latest AppImage of neovim using cURL
  ansible.builtin.get_url:
    url: https://github.com/neovim/neovim/releases/latest/download/nvim-linux-x86_64.appimage
    dest: /tmp/nvim-linux-x86_64.appimage

- name: Make the AppImage executable
  ansible.builtin.file:
    path: /tmp/nvim-linux-x86_64.appimage
    mode: '+x'
  delegate_to: localhost

- name: Move the AppImage to a system directory
  ansible.builtin.copy:
    src: /tmp/nvim-linux-x86_64.appimage
    dest: /usr/local/bin/nvim
    mode: '+x'
  delegate_to: localhost

- name: Create a symlink for nvim
  ansible.builtin.file:
    src: /usr/local/bin/nvim
    dest: /usr/bin/nvim
    state: link
  delegate_to: localhost

