---
# https://theforeman.org/manuals/5.0/quickstart_guide.html
#
# TODO: Add GPG key for Foreman and OpenVox repositories
#
# Tasks file for eom_foreman

# Make sure the Foreman server has firewalld installed and running, and that the required ports are open
- include_tasks: firewalld.yml

# https://docs.ansible.com/projects/ansible/latest/collections/theforeman/foreman/user_module.html
# Install python dependency for 'theforeman' collection
- name: "Install python3-requests on Foreman server"
  ansible.builtin.dnf:
    name: python3-requests
    state: present

- name: "Check for existense of Foreman dnf/yum repository"
  ansible.builtin.stat:
    path: /etc/yum.repos.d/foreman.repo
  register: foreman_repo

- name: "Check for existense of OpenVox dnf/yum repository"
  ansible.builtin.stat:
    path: /etc/yum.repos.d/openvox8-release.repo
  register: openvox_repo

- name: "Add Foreman dnf/yum repository"
  ansible.builtin.get_url:
    url: https://yum.theforeman.org/releases/5.0/el9/x86_64/foreman-release.rpm
    dest: /tmp/foreman-release.rpm
  when: not foreman_repo.stat.exists

- name: "Add OpenVox 8.x dnf/yum repository"
  ansible.builtin.get_url:
    url: https://yum.voxpupuli.org/openvox8-release-el-9.noarch.rpm
    dest: /tmp/openvox-release.rpm
  when: not openvox_repo.stat.exists

- name: "Install Foreman dnf/yum repository"
  ansible.builtin.dnf:
    name: /tmp/foreman-release.rpm
    state: present
    disable_gpg_check: yes
  when: not foreman_repo.stat.exists

- name: "Install OpenVox 8.x dnf/yum repository"
  ansible.builtin.dnf:
    name: /tmp/openvox-release.rpm
    state: present
    disable_gpg_check: yes
  when: not openvox_repo.stat.exists

- name: "Install foreman-installer on Foreman server"
  ansible.builtin.dnf:
    name: foreman-installer
    state: present

- name: "Install plugins on Foreman server"
  ansible.builtin.dnf:
    name:
      - rubygem-foreman_fog_proxmox
      - rubygem-foreman_ansible
    state: present
    update_cache: yes

- name: "Check whether Foreman is installed and running"
  ansible.builtin.stat:
    path: /usr/share/foreman-proxy/bin/smart-proxy
  register: foreman_installed

- name: "Fail with guidance if Foreman is not installed and running"
  ansible.builtin.fail:
    msg: "Foreman is not installed and running. Please run 'foreman-installer' on the Foreman server."
  when: not foreman_installed.stat.exists

- name: "Create my Primary Organization"
  theforeman.foreman.organization:
    username: 'admin'
    password: "{{ foreman_admin_pass }}"
    server_url: "https://{{ foreman_server }}"
    name: 'EdsonManners.com'
    state: present
    validate_certs: false
    #ca_path: '/home/emanners/Documents/Git/ansible/callbacks/client_ca.pem'  # Must exist on ansible client

- name: "Create my TailScale Organization"
  theforeman.foreman.organization:
    username: 'admin'
    password: "{{ foreman_admin_pass }}"
    server_url: "https://{{ foreman_server }}"
    name: 'TailScale'
    state: present
    validate_certs: false

- name: "Create my Primary Location"
  theforeman.foreman.location:
    username: 'admin'
    password: "{{ foreman_admin_pass }}"
    server_url: "https://{{ foreman_server }}"
    name: 'Houston'
    state: present
    validate_certs: false

- name: "Create my Secondary Location"
  theforeman.foreman.location:
    username: 'admin'
    password: "{{ foreman_admin_pass }}"
    server_url: "https://{{ foreman_server }}"
    name: 'Tallahassee'
    state: present
    validate_certs: false

- include_tasks: users.yml
- include_tasks: media.yml
- include_tasks: architecture.yml
- include_tasks: operatingsystems.yml
#- include_tasks: domains.yml
- include_tasks: subnets.yml
- include_tasks: hostgroups.yml
- include_tasks: hosts.yml
- include_tasks: jobs.yml
