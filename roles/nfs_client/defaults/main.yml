---
# NFS server (Ganesha on infra01) and the NFSv4 pseudo path.
nfs_client_src: infra01.edsonmanners.com:/extHD
nfs_client_path: /mnt/extHD
nfs_client_fstype: nfs4
# Do not include clientaddr — that is per-host and must not be in fstab.
nfs_client_opts: rw,relatime,vers=4.2,rsize=1048576,wsize=1048576,hard,proto=tcp,timeo=600,retrans=2,sec=sys,_netdev

# Docker named volume used by Swarm services that must schedule on any node.
nfs_client_docker_volume_name: nfs-dockerswarm
nfs_client_docker_device: :/extHD/DockerSwarm
nfs_client_docker_addr: infra01.edsonmanners.com
nfs_client_docker_opts: "addr={{ nfs_client_docker_addr }},rw,nfsvers=4.2,hard,timeo=600,retrans=2,sec=sys"
